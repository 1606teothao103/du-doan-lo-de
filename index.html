<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DỰ ĐOÁN LÔ ĐỀ MIỀN NAM</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f0c29; color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: #16213e; width: 92%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 127, 0.2); border: 1px solid #1f4068; box-sizing: border-box; }
        .station-info { background: #1a1a2e; padding: 10px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #f1c40f; font-size: 13px; }
        .input-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 20px; }
        .input-box { width: 32%; }
        label { font-size: 10px; color: #00d2ff; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1f4068; background: #0f3460; color: #fff; text-align: center; box-sizing: border-box; font-weight: bold; font-size: 18px; }
        #main-result-box { background: #fff; margin: 20px auto; width: 130px; height: 130px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 5px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        #main-result { font-size: 65px; font-weight: bold; color: #1a1a2e; }
        .sub-results { display: flex; justify-content: space-around; margin: 20px 0; }
        .sub-box { background: #1f4068; padding: 10px; border-radius: 10px; width: 80px; border: 1px solid #00d2ff; }
        .sub-val { font-size: 24px; font-weight: bold; color: #f1c40f; }
        button { background: linear-gradient(45deg, #00ffcc, #00d2ff); color: #1a1a2e; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        #btnSync { background: #27ae60; color: white; padding: 10px; font-size: 13px; margin-bottom: 15px; width: auto; display: inline-block; padding: 10px 20px; }
        #statusText { font-size: 12px; color: #bdc3c7; margin-top: 15px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #00ffcc; margin-top: 0;">DỰ ĐOÁN LÔ ĐỀ</h2>
        
        <div class="station-info" id="station-info">Đang kiểm tra lịch quay...</div>

        <button id="btnSync" onclick="autoReadLottery()">📡 TỰ ĐỘNG ĐIỀN KẾT QUẢ</button>

        <div class="input-row">
            <div class="input-box"><label>GIẢI 8</label><input type="text" id="g8" placeholder="--"></div>
            <div class="input-box"><label>G.NHẤT</label><input type="text" id="g1" placeholder="--"></div>
            <div class="input-box"><label>ĐẶC BIỆT</label><input type="text" id="gdb" placeholder="--"></div>
        </div>
<div id="main-result-box"><div id="main-result">??</div></div>

        <div class="sub-results">
            <div class="sub-box"><div class="sub-val" id="s1">--</div></div>
            <div class="sub-box"><div class="sub-val" id="s2">--</div></div>
            <div class="sub-box"><div class="sub-val" id="s3">--</div></div>
        </div>
        
        <button id="btnQuay" onclick="runAI()">BẮT ĐẦU PHÂN TÍCH</button>
        <p id="statusText">Hệ thống sẵn sàng</p>
    </div>

    <script>
        // Xác định đài hôm nay
        const days = ["Chủ Nhật (Tiền Giang)", "Thứ 2 (TP.HCM)", "Thứ 3 (Vũng Tàu)", "Thứ 4 (Đồng Nai)", "Thứ 5 (Tây Ninh)", "Thứ 6 (Bình Dương)", "Thứ 7 (TP.HCM)"];
        document.getElementById('station-info').innerHTML = "Hôm nay: " + days[new Date().getDay()];

        async function autoReadLottery() {
            const status = document.getElementById('statusText');
            const btn = document.getElementById('btnSync');
            status.innerHTML = "🔍 Đang đọc dữ liệu từ Minh Ngọc/XSkt...";
            btn.disabled = true;

            try {
                // Sử dụng Proxy để đọc dữ liệu RSS Miền Nam
                const response = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://www.minhngoc.net.vn/google/rss-mien-nam.rss'));
                const data = await response.json();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                
                // Lấy nội dung bản tin mới nhất
                const description = xmlDoc.getElementsByTagName("description")[1].childNodes[0].nodeValue;

                // Dùng Regex (công cụ tìm kiếm văn bản) để bốc đúng số
                const g8Match = description.match(/G8:\s*(\d+)/);
                const g1Match = description.match(/G1:\s*(\d+)/);
                const gdbMatch = description.match(/ĐB:\s*(\d+)/);

                if (g8Match && g1Match && gdbMatch) {
                    // Lấy 2 số cuối của các giải
                    document.getElementById('g8').value = g8Match[1].slice(-2);
                    document.getElementById('g1').value = g1Match[1].slice(-2);
                    document.getElementById('gdb').value = gdbMatch[1].slice(-2);
                    status.innerHTML = "✅ Đã điền số thành công!";
                } else {
                    status.innerHTML = "⚠️ Chưa có kết quả mới. Thử lại sau 16h15!";
                }
            } catch (error) {
                status.innerHTML = "❌ Lỗi kết nối nguồn dữ liệu.";
                console.error(error);
            }
            btn.disabled = false;
        }

        function runAI() {
            const g8 = document.getElementById('g8').value;
if(!g8) { alert("Vui lòng bấm nút 'Tự động điền' trước!"); return; }
            
            let count = 0;
            const btn = document.getElementById('btnQuay');
            btn.disabled = true;
            const timer = setInterval(() => {
                document.getElementById('main-result').innerHTML = Math.floor(Math.random()*100).toString().padStart(2,'0');
                count++;
                if (count > 30) {
                    clearInterval(timer);
                    let final = (parseInt(g8) + Math.floor(Math.random()*20)) % 100;
                    document.getElementById('main-result').innerHTML = final.toString().padStart(2,'0');
                    document.getElementById('s1').innerHTML = ((final + 2) % 100).toString().padStart(2,'0');
                    document.getElementById('s2').innerHTML = ((final + 10) % 100).toString().padStart(2,'0');
                    document.getElementById('s3').innerHTML = Math.abs(final - 5).toString().padStart(2,'0');
                    btn.disabled = false;
                }
            }, 50);
        }
    </script>
</body>
</html>
