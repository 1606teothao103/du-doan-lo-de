<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SỐ ĐỎ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f0c29; color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: #16213e; width: 92%; max-width: 400px; padding: 25px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 127, 0.2); border: 1px solid #1f4068; box-sizing: border-box; }
        .station-info { background: #1a1a2e; padding: 12px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #f1c40f; font-size: 14px; }
        #btnGet { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-size: 12px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .input-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
        .input-box { width: 32%; }
        label { font-size: 10px; color: #00d2ff; display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1f4068; background: #0f3460; color: #fff; text-align: center; box-sizing: border-box; font-weight: bold; font-size: 20px; }
        #main-result-box { background: #fff; margin: 20px auto; width: 120px; height: 120px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 5px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        #main-result { font-size: 60px; font-weight: bold; color: #1a1a2e; }
        .sub-results { display: flex; justify-content: space-around; margin: 20px 0; }
        .sub-box { background: #1f4068; padding: 10px; border-radius: 10px; width: 80px; border: 1px solid #00d2ff; }
        .sub-val { font-size: 24px; font-weight: bold; color: #f1c40f; }
        #btnQuay { background: linear-gradient(45deg, #00ffcc, #00d2ff); color: #1a1a2e; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        #statusText { font-size: 13px; color: #ffcc00; margin-top: 15px; min-height: 35px; font-weight: 500; display: flex; align-items: center; justify-content: center; padding: 0 10px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #00ffcc; margin-top: 0;">DỰ ĐOÁN LÔ ĐỀ MIỀN NAM</h2>
        <div class="station-info" id="station-info">📅 Đang xem lịch...</div>

        <button id="btnGet" onclick="syncData()">📡 LẤY KẾT QUẢ MỚI NHẤT</button>

        <div class="input-row">
            <div class="input-box"><label>GIẢI 8</label><input type="text" id="g8" readonly placeholder="--"></div>
            <div class="input-box"><label>G.NHẤT</label><input type="text" id="g1" readonly placeholder="--"></div>
<div class="input-box"><label>ĐẶC BIỆT</label><input type="text" id="gdb" readonly placeholder="--"></div>
        </div>

        <div id="main-result-box"><div id="main-result">??</div></div>
        
        <div class="sub-results">
            <div class="sub-box"><div class="sub-val" id="s1">--</div></div>
            <div class="sub-box"><div class="sub-val" id="s2">--</div></div>
            <div class="sub-box"><div class="sub-val" id="s3">--</div></div>
        </div>
        
        <button id="btnQuay" onclick="runAI()">BẮT ĐẦU DỰ ĐOÁN</button>
        <p id="statusText">Hãy nhấn nút lấy kết quả!</p>
    </div>

    <script>
        const days = ["Chủ Nhật (Tiền Giang)", "Thứ 2 (TP.HCM)", "Thứ 3 (Vũng Tàu)", "Thứ 4 (Đồng Nai)", "Thứ 5 (Tây Ninh)", "Thứ 6 (Bình Dương)", "Thứ 7 (TP.HCM)"];
        document.getElementById('station-info').innerHTML = "📅 " + days[new Date().getDay()];

        const funnyMessages = [
            "❌ Hội đồng đang bận ăn cơm, chưa quay đâu!",
            "❌ Xem giấy dò rồi nhấc cái tay lên mà gõ số vào đê!",
            "❌ Không có số thì soi bằng niềm tin à?",
            "❌ Tầm này chưa có số mới, đi uống trà đá đi rồi quay lại!",
            "❌ Admin chưa nạp số, đừng có mà nhấn lấy số hoài!"
        ];

        function syncData() {
            const status = document.getElementById('statusText');
            const now = new Date();
            const todayStr = now.toLocaleDateString('sv-SE');
            const currentTime = now.getHours() * 100 + now.getMinutes();

            // Lấy dữ liệu lưu từ trang Scan (LocalStorage)
            const savedData = JSON.parse(localStorage.getItem('lottery_data'));

            // LOGIC KHÓA: Sau 15h30 mà dữ liệu chưa cập nhật ngày mới
            if (currentTime >= 1530) {
                if (!savedData || savedData.date !== todayStr) {
                    status.innerHTML = funnyMessages[Math.floor(Math.random() * funnyMessages.length)];
                    resetInputs();
                    return;
                }
            }

            if (savedData) {
                document.getElementById('g8').value = savedData.g8;
                document.getElementById('g1').value = savedData.g1;
                document.getElementById('gdb').value = savedData.gdb;
                status.innerHTML = "✅ Đã đồng bộ số ngày " + savedData.date;
            } else {
                status.innerHTML = "❌ Hệ thống chưa có dữ liệu. Đợi Admin nhé!";
            }
        }

        function resetInputs() {
            document.getElementById('g8').value = "";
            document.getElementById('g1').value = "";
            document.getElementById('gdb').value = "";
        }

        function runAI() {
            const g8 = document.getElementById('g8').value;
const status = document.getElementById('statusText');

            if(!g8) {
                status.innerHTML = "❌ Không có số thì soi bằng niềm tin à?";
                return;
            }
            
            const btn = document.getElementById('btnQuay');
            btn.disabled = true;
            let count = 0;
            const timer = setInterval(() => {
                document.getElementById('main-result').innerHTML = Math.floor(Math.random()*100).toString().padStart(2,'0');
                count++;
                if (count > 30) {
                    clearInterval(timer);
                    let seed = parseInt(g8);
                    let final = (seed + 13) % 100;
                    document.getElementById('main-result').innerHTML = final.toString().padStart(2,'0');
                    document.getElementById('s1').innerHTML = ((final + 1) % 100).toString().padStart(2,'0');
                    document.getElementById('s2').innerHTML = ((final + 10) % 100).toString().padStart(2,'0');
                    document.getElementById('s3').innerHTML = Math.abs(final - 5).toString().padStart(2,'0');
                    btn.disabled = false;
                }
            }, 50);
        }
    </script>
</body>
</html>
