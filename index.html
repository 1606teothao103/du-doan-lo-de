<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SỐ ĐỎ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #0f0c29; color: #fff; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        .container { background: #16213e; width: 92%; max-width: 380px; padding: 20px; border-radius: 20px; box-shadow: 0 0 30px rgba(0, 255, 127, 0.2); border: 1px solid #1f4068; }
        
        .header-info { background: #1a1a2e; padding: 12px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #f1c40f; text-align: left; }
        .date-text { font-size: 14px; color: #f1c40f; font-weight: bold; display: block; }
        .station-text { font-size: 13px; color: #00d2ff; font-weight: 500; margin-top: 3px; }

        #btnGet { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 14px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        
        .input-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
        .input-box { width: 32%; }
        label { font-size: 10px; color: #00d2ff; display: block; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1f4068; background: #0f3460; color: #fff; text-align: center; box-sizing: border-box; font-weight: bold; font-size: 22px; }
        
        #main-result-box { background: #fff; margin: 15px auto; width: 115px; height: 115px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 5px solid #00ffcc; box-shadow: 0 0 20px #00ffcc; }
        #main-result { font-size: 55px; font-weight: bold; color: #1a1a2e; }
        
        .sub-results { display: flex; justify-content: space-around; margin: 15px 0; }
        .sub-box { background: #1f4068; padding: 8px; border-radius: 10px; width: 75px; border: 1px solid #00d2ff; }
        .sub-val { font-size: 20px; font-weight: bold; color: #f1c40f; }
        
        #btnQuay { background: linear-gradient(45deg, #00ffcc, #00d2ff); color: #1a1a2e; border: none; padding: 15px; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        #statusText { font-size: 13px; color: #ffcc00; margin-top: 15px; min-height: 35px; line-height: 1.4; display: flex; align-items: center; justify-content: center; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #00ffcc; margin: 0 0 10px 0; font-size: 24px;">DỰ ĐOÁN LÔ ĐỀ MIỀN NAM</h2>
        
        <div class="header-info">
            <span id="currentDate" class="date-text">📅 Đang tải ngày...</span>
            <span id="currentStation" class="station-text">📍 Đang xem lịch mở thưởng...</span>
        </div>

        <button id="btnGet" onclick="syncData()">📡 LẤY KẾT QUẢ MỚI NHẤT</button>

        <div class="input-row">
            <div class="input-box"><label>GIẢI 8</label><input type="text" id="g8" readonly placeholder="--"></div>
            <div class="input-box"><label>G.NHẤT</label><input type="text" id="g1" readonly placeholder="--"></div>
            <div class="input-box"><label>ĐẶC BIỆT</label><input type="text" id="gdb" readonly placeholder="--"></div>
        </div>

        <div id="main-result-box"><div id="main-result">??</div></div>
        
        <div class="sub-results">
            <div class="sub-box"><div class="sub-val" id="s1">--</div></div>
            <div class="sub-box"><div class="sub-val" id="s2">--</div></div>
            <div class="sub-box"><div class="sub-val" id="s3">--</div></div>
        </div>
        
        <button id="btnQuay" onclick="runAI()">BẮT ĐẦU DỰ ĐOÁN</button>
        <p id="statusText">Bấm nút phía trên để kết nối dữ liệu!</p>
    </div>

    <script>
        // --- CẤU HÌNH ĐỊA CHỈ GIST CỦA BẠN ---
        const GIST_URL = 'https://gist.githubusercontent.com/1606teothao103/1d2985cad9f6a517f9025fef7ab36aa1/raw/lottery.json';

        // Tự động hiển thị Ngày và Đài Miền Nam
        function updateCalendar() {
            const now = new Date();
            const days = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            const stations = [
                "Tiền Giang",
                "TP.HCM",
                "Vũng Tàu",
                "Đồng Nai",
                "Tây Ninh",
                "Bình Dương",
                "TP.HCM"
            ];
            
            const dateStr = now.toLocaleDateString('vi-VN');
            document.getElementById('currentDate').innerText = `📅 ${days[now.getDay()]}, ${dateStr}`;
            document.getElementById('currentStation').innerText = `📍 Đài: ${stations[now.getDay()]}`;
        }
        updateCalendar();

        async function syncData() {
            const status = document.getElementById('statusText');
            status.innerHTML = "⏳ Đang đồng bộ kết quả...";
            
            try {
                const response = await fetch(GIST_URL + '?t=' + Date.now());
                const data = await response.json();
                
                const now = new Date();
                const todayStr = now.toLocaleDateString('sv-SE'); // YYYY-MM-DD
                const currentTime = now.getHours() * 100 + now.getMinutes();

                // Kiểm tra nếu sau 15h30 mà chưa có số mới của ngày hôm nay
                if (currentTime >= 1530 && data.date !== todayStr) {
                    status.innerHTML = "❌ Không có số thì soi bằng niềm tin à?";
                    document.getElementById('g8').value = "";
                    return;
                }

                document.getElementById('g8').value = data.g8;
                document.getElementById('g1').value = data.g1;
                document.getElementById('gdb').value = data.gdb;
                status.innerHTML = "✅ Đã nhận dữ liệu ngày " + (data.date || "hôm nay");
                
            } catch (err) {
                status.innerHTML = "❌ Lỗi: Chưa kết nối được thùng thư!";
            }
        }

        function runAI() {
            const g8 = document.getElementById('g8').value;
            if(!g8) {
                document.getElementById('statusText').innerHTML = "❌ Không có số thì soi bằng niềm tin à?";
                return;
            }
            
            const btn = document.getElementById('btnQuay');
            btn.disabled = true;
            let count = 0;
            const timer = setInterval(() => {
                document.getElementById('main-result').innerHTML = Math.floor(Math.random()*100).toString().padStart(2,'0');
                count++;
                if (count > 25) {
                    clearInterval(timer);
                    let seed = parseInt(g8);
                    let final = (seed + 19) % 100; // Công thức dự đoán
                    document.getElementById('main-result').innerHTML = final.toString().padStart(2,'0');
                    document.getElementById('s1').innerHTML = ((final + 1) % 100).toString().padStart(2,'0');
                    document.getElementById('s2').innerHTML = ((final + 10) % 100).toString().padStart(2,'0');
                    document.getElementById('s3').innerHTML = Math.abs(final - 5).toString().padStart(2,'0');
                    btn.disabled = false;
                    document.getElementById('statusText').innerHTML = "✨ Đã soi xong! Chúc may mắn!";
                }
            }, 50);
        }
    </script>
</body>
</html>
