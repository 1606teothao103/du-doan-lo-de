<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Scan - Nạp Số</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .box { background: #16213e; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>ADMIN NẠP SỐ 📸</h2>
        <input type="file" id="file-input" accept="image/*">
        <p id="status">Chọn ảnh giấy dò hôm nay</p>
        
        <div id="result" style="display:none">
            <p>G8: <span id="r8"></span> | G1: <span id="r1"></span> | ĐB: <span id="rdb"></span></p>
            <button onclick="shareLink()">🔗 GỬI LINK MỚI CHO BẠN BÈ</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', async (e) => {
            document.getElementById('status').innerHTML = "⏳ AI đang đọc...";
            const result = await Tesseract.recognize(e.target.files[0], 'eng');
            const nums = result.data.text.match(/\d+/g);
            if(nums && nums.length >= 3) {
                document.getElementById('r8').innerText = nums[0].slice(-2);
                document.getElementById('r1').innerText = nums[1].slice(-2);
                document.getElementById('rdb').innerText = nums[nums.length-1].slice(-2);
                document.getElementById('result').style.display = "block";
                document.getElementById('status').innerHTML = "✅ Quét xong!";
            }
        });

        function shareLink() {
            const g8 = document.getElementById('r8').innerText;
            const g1 = document.getElementById('r1').innerText;
            const db = document.getElementById('rdb').innerText;
            const shareUrl = window.location.origin + window.location.pathname.replace('scan.html', 'index.html') + `?data=${g8}-${g1}-${db}`;
            navigator.clipboard.writeText(shareUrl);
            alert("Đã sao chép Link mới! Gửi link này để bạn bè chơi được tiếp nhé.");
        }
    </script>
</body>
</html>
