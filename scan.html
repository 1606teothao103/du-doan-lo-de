<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Nạp Số</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 15px; }
        .box { background: #16213e; padding: 20px; border-radius: 15px; border: 2px solid #27ae60; max-width: 400px; margin: auto; }
        .file-upload { display: block; padding: 20px; background: #0f3460; border: 2px dashed #27ae60; border-radius: 10px; cursor: pointer; margin-bottom: 20px; font-weight: bold; color: #00ffcc; }
        input[type="file"] { display: none; }
        .input-group { margin-top: 15px; text-align: left; }
        label { display: block; font-size: 13px; color: #f1c40f; margin-bottom: 5px; font-weight: bold; }
        .num-input { width: 100%; padding: 15px; background: #1a1a2e; border: 2px solid #27ae60; color: #fff; border-radius: 10px; font-size: 24px; text-align: center; font-weight: bold; box-sizing: border-box; }
        button { background: #27ae60; color: white; padding: 18px; border: none; border-radius: 12px; width: 100%; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 15px rgba(39,174,96,0.4); }
        #status { color: #00ffcc; margin: 15px 0; font-size: 14px; min-height: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin-top:0">QUÉT & NẠP SỐ 🚀</h2>
        
        <label class="file-upload">
            <span>📷 CHỌN ẢNH GIẤY DÒ</span>
            <input type="file" id="file-input" accept="image/*">
        </label>

        <div id="status">Chưa có dữ liệu</div>

        <div class="input-group">
            <label>GIẢI 8 (2 số):</label>
            <input type="number" id="final_g8" class="num-input">
        </div>
        <div class="input-group">
            <label>GIẢI NHẤT (2 số cuối):</label>
            <input type="number" id="final_g1" class="num-input">
        </div>
        <div class="input-group">
            <label>ĐẶC BIỆT (2 số cuối):</label>
            <input type="number" id="final_gdb" class="num-input">
        </div>

        <button onclick="sendData()">📡 CẬP NHẬT HỆ THỐNG</button>
    </div>

    <script>
        // CHIA ĐÔI TOKEN ĐỂ GITHUB KHÔNG KHÓA (Gán mã của bạn vào đây)
        const p1 = 'ghp_tzZKrRYZCzYaTdIo9'; // Dán 1 nửa mã vào đây
        const p2 = 'LrsOC7599uB2u0OSqSE';     // Dán nửa còn lại vào đây
        const GIST_ID = '1d2985cad9f6a517f9025fef7ab36aa1';

        // 1. Xử lý đọc ảnh
        document.getElementById('file-input').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('status').innerText = "🌀 AI đang soi số...";
            
            const result = await Tesseract.recognize(file, 'eng');
            const nums = result.data.text.match(/\d+/g);
            
            if(nums && nums.length >= 3) {
                // Điền tạm vào ô, nếu sai bạn cứ việc xóa đi gõ lại
                document.getElementById('final_g8').value = nums[0].slice(-2);
                document.getElementById('final_g1').value = nums[1].slice(-2);
                document.getElementById('final_gdb').value = nums[nums.length-1].slice(-2);
                document.getElementById('status').innerText = "✅ Đã đọc xong! Hãy sửa lại nếu sai.";
            } else {
                document.getElementById('status').innerText = "❌ Không đọc được. Bạn hãy tự nhập tay!";
            }
        });

        // 2. Gửi dữ liệu (Lấy chính xác những gì bạn đã nhập trong ô)
        async function sendData() {
            const s = document.getElementById('status');
            s.innerText = "⏳ Đang gửi... (vui lòng chờ)";
            
            const payload = {
                g8: document.getElementById('final_g8').value,
                g1: document.getElementById('final_g1').value,
                gdb: document.getElementById('final_gdb').value,
                date: new Date().toLocaleDateString('sv-SE')
            };

            try {
                const res = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${p1}${p2}` },
                    body: JSON.stringify({ files: { "lottery.json": { content: JSON.stringify(payload) } } })
                });

                if(res.ok) {
                    s.innerText = "🚀 THÀNH CÔNG! Đã cập nhật.";
                    alert("Đã xong! Hệ thống đã nhận đúng số bạn nhập.");
                } else {
                    const err = await res.json();
                    s.innerText = "❌ Lỗi: " + err.message;
                }
            } catch (e) { s.innerText = "❌ Lỗi mạng!"; }
        }
    </script>
</body>
</html>
