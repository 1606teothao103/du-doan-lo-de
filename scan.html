<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Nạp Số Hệ Thống</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .box { background: #16213e; padding: 20px; border-radius: 15px; max-width: 400px; margin: auto; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px;}
    </style>
</head>
<body>
    <div class="box">
        <h2>HỆ THỐNG NẠP SỐ 🚀</h2>
        <input type="file" id="file-input" accept="image/*">
        <p id="status">Quét ảnh xong nhấn "Cập Nhật Toàn Hệ Thống"</p>
        <div id="result" style="display:none">
            <p>G8: <span id="r8"></span> | G1: <span id="r1"></span> | ĐB: <span id="rdb"></span></p>
            <button onclick="updateSystem()">📡 CẬP NHẬT TOÀN HỆ THỐNG</button>
        </div>
    </div>

    <script>
        let currentNums = {};
        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', async (e) => {
            document.getElementById('status').innerHTML = "⏳ AI đang đọc...";
            const result = await Tesseract.recognize(e.target.files[0], 'eng');
            const nums = result.data.text.match(/\d+/g);
            if(nums && nums.length >= 3) {
                currentNums = {
                    g8: nums[0].slice(-2),
                    g1: nums[1].slice(-2),
                    gdb: nums[nums.length-1].slice(-2),
                    date: new Date().toLocaleDateString('sv-SE') // Định dạng YYYY-MM-DD
                };
                document.getElementById('r8').innerText = currentNums.g8;
                document.getElementById('r1').innerText = currentNums.g1;
                document.getElementById('rdb').innerText = currentNums.gdb;
                document.getElementById('result').style.display = "block";
                document.getElementById('status').innerHTML = "✅ Quét xong! Hãy cập nhật.";
            }
        });

        function updateSystem() {
            // Lưu vào LocalStorage để trang Index cùng trình duyệt có thể đọc (Nếu bạn dùng chung máy)
            localStorage.setItem('lottery_data', JSON.stringify(currentNums));
            alert("✅ Đã cập nhật số mới cho ngày hôm nay!");
        }
    </script>
</body>
</html>
