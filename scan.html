<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Nạp Số - Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 15px; }
        .box { background: #16213e; padding: 20px; border-radius: 15px; border: 2px solid #27ae60; max-width: 400px; margin: auto; }
        .file-upload { display: block; padding: 20px; background: #0f3460; border: 2px dashed #27ae60; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .input-group { margin-top: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #00ffcc; margin-bottom: 5px; }
        /* Cho phép sửa số trực tiếp */
        .num-input { width: 100%; padding: 12px; background: #1a1a2e; border: 1px solid #27ae60; color: #fff; border-radius: 8px; font-size: 20px; text-align: center; font-weight: bold; margin-bottom: 10px; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 10px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        #status { color: #f1c40f; margin: 15px 0; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>HỆ THỐNG NẠP SỐ 🚀</h2>
        
        <label class="file-upload">
            <span>📁 CHỌN ẢNH KẾT QUẢ</span>
            <input type="file" id="file-input" accept="image/*">
        </label>

        <div id="status">Chưa có dữ liệu</div>

        <div id="res-box" style="display: block;">
            <div class="input-group">
                <label>GIẢI 8 (2 số):</label>
                <input type="number" id="r8" class="num-input" placeholder="Nhập số">
            </div>
            <div class="input-group">
                <label>GIẢI NHẤT (2 số cuối):</label>
                <input type="number" id="r1" class="num-input" placeholder="Nhập số">
            </div>
            <div class="input-group">
                <label>ĐẶC BIỆT (2 số cuối):</label>
                <input type="number" id="rdb" class="num-input" placeholder="Nhập số">
            </div>
            <button onclick="updateToSystem()">📡 CẬP NHẬT TOÀN HỆ THỐNG</button>
        </div>
    </div>

    <script>
        // --- ĐIỀN THÔNG TIN CỦA BẠN VÀO ĐÂY ---
        const GITHUB_TOKEN = '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'; 
        const GIST_ID = '1d2985cad9f6a517f9025fef7ab36aa1'; 
        // --------------------------------------

        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('status').innerHTML = "🌀 Đang quét ảnh... chờ tí!";
            
            try {
                const result = await Tesseract.recognize(file, 'eng');
                const nums = result.data.text.match(/\d+/g);
                if(nums && nums.length >= 3) {
                    // Lấy đại diện, nếu sai bạn vẫn sửa tay được
                    document.getElementById('r8').value = nums[0].slice(-2);
                    document.getElementById('r1').value = nums[1].slice(-2);
                    document.getElementById('rdb').value = nums[nums.length-1].slice(-2);
                    document.getElementById('status').innerHTML = "✅ Quét xong! Hãy kiểm tra và sửa lại nếu sai.";
                }
            } catch (err) { document.getElementById('status').innerHTML = "❌ Lỗi đọc ảnh. Bạn hãy tự nhập số nhé!"; }
        });

        async function updateToSystem() {
            const status = document.getElementById('status');
            status.innerHTML = "⏳ Đang đồng bộ... (đừng tắt)";
            
            const data = {
                g8: document.getElementById('r8').value,
                g1: document.getElementById('r1').value,
                gdb: document.getElementById('rdb').value,
                date: new Date().toLocaleDateString('sv-SE')
            };

            if(!data.g8 || !data.g1 || !data.gdb) {
                alert("Vui lòng nhập đủ số trước khi cập nhật!");
                status.innerHTML = "❌ Thiếu số!";
                return;
            }

            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: { "lottery.json": { content: JSON.stringify(data) } } })
                });

                if(response.ok) {
                    status.innerHTML = "🚀 THÀNH CÔNG! Đã nạp số.";
                    alert("Đã cập nhật số thành công!");
                } else {
                    const errData = await response.json();
                    status.innerHTML = "❌ Lỗi: " + (errData.message || "Không xác định");
                }
            } catch (err) {
                status.innerHTML = "❌ Lỗi kết nối mạng!";
                console.error(err);
            }
        }
    </script>
</body>
</html>
